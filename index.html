<!DOCTYPE html><html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video + Music</title><style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    video {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        display: block;
        pointer-events: none;
    }

    #start {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,.65);
        color: white;
        font: bold 20px Arial;
        cursor: pointer;
        z-index: 10;
    }
</style>

</head><body><video id="video" autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="start">▶ CHẠM ĐỂ BẮT ĐẦU</div>

<script>
    const video = document.getElementById("video");
    const music = document.getElementById("music");
    const start = document.getElementById("start");

    start.addEventListener("click", async () => {
        video.muted = true;
        await video.play();
        await music.play();

        start.style.display = "none";
    });

    // Không cho video bị pause
    video.addEventListener("pause", () => {
        video.play();
    });

    // Nếu video bị dừng vì lý do nào đó, phát lại
    video.addEventListener("ended", () => {
        video.currentTime = 0;
        video.play();
    });
</script>

</body>
</html>
