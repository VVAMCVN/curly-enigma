<!DOCTYPE html><html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video + Music</title><style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    video {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        display: block;
        pointer-events: none;
    }
</style>

</head><body><!-- VIDEO MP4 -->
<video id="video" autoplay loop playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<!-- NHẠC MP3 -->
<audio id="music" autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
    const video = document.getElementById("video");
    const music = document.getElementById("music");

    video.muted = false;
    video.volume = 1;
    music.volume = 1;

    // Tự phát ngay khi trang mở
    video.play().catch(() => {});
    music.play().catch(() => {});

    // Không cho video pause
    video.addEventListener("pause", () => {
        video.play().catch(() => {});
    });

    // Không cho nhạc pause
    music.addEventListener("pause", () => {
        music.play().catch(() => {});
    });

    // Video lặp
    video.addEventListener("ended", () => {
        video.currentTime = 0;
        video.play().catch(() => {});
    });
</script>

</body>
</html>
