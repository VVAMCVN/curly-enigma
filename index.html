<!DOCTYPE html><html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Video</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    .video-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
    }

    .sound-message {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        background: rgba(0, 0, 0, 0.65);
        padding: 10px 18px;
        border-radius: 20px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        pointer-events: none;
    }
</style>

</head><body><div class="video-container">
    <video id="video" autoplay muted loop playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>
</div><div class="sound-message" id="soundMessage">
    Chạm màn hình để bật tiếng 🔊
</div><script>
    const video = document.getElementById("video");
    const message = document.getElementById("soundMessage");

    function enableSound() {
        video.muted = false;
        video.volume = 1;
        video.play();

        message.style.display = "none";

        document.removeEventListener("click", enableSound);
        document.removeEventListener("touchstart", enableSound);
    }

    document.addEventListener("click", enableSound);
    document.addEventListener("touchstart", enableSound);
</script></body>
</html>
